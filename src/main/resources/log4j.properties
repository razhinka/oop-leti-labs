# ==============================================================================
# Конфигурация логирования Log4j для проекта «Регистратура поликлиники»
# Лабораторная работа № 10: Протоколирование/Логирование
# ==============================================================================

# Корневой уровень логирования и вывод в консоль и файл
log4j.rootLogger=INFO, stdout, file

# ------------------------------------------------------------------------------
# 1. Аппендер консольного вывода (ConsoleAppender)
# ------------------------------------------------------------------------------
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1} - %m%n

# ------------------------------------------------------------------------------
# 2. Аппендер записи в файл с ротацией (RollingFileAppender)
# ------------------------------------------------------------------------------
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/clinic.log
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c - %m%n
log4j.appender.file.encoding=UTF-8

# ------------------------------------------------------------------------------
# 3. Настройка уровней логирования по пакетам
# ------------------------------------------------------------------------------
# Для пакетов нашего приложения включаем подробный уровень DEBUG
log4j.logger.com.engine=DEBUG

# Для сторонних библиотек отключаем избыточный отладочный вывод
log4j.logger.net.sf.jasperreports=WARN
log4j.logger.org.apache=WARN
log4j.logger.jaxen=WARN
