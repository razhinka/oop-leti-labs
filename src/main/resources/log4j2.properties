# ==============================================================================
# Конфигурация Log4j 2 (Properties format)
# Лабораторная работа № 10: Протоколирование/Логирование
# ==============================================================================
status = WARN
name = ClinicRegistryPropertiesConfig

# Аппендеры (Console и RollingFile)
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1} - %m%n

appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = logs/clinic.log
appender.rolling.filePattern = logs/clinic-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 5MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5

# Корневой логгер
rootLogger.level = INFO
rootLogger.appenderRefs = stdout, rolling
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.rolling.ref = RollingFile

# Логгер приложения (вывод DEBUG, INFO, WARN, ERROR)
logger.clinic.name = com.engine
logger.clinic.level = DEBUG
logger.clinic.additivity = false
logger.clinic.appenderRefs = stdout, rolling
logger.clinic.appenderRef.stdout.ref = STDOUT
logger.clinic.appenderRef.rolling.ref = RollingFile

# Ограничение сторонних библиотек
logger.jasper.name = net.sf.jasperreports
logger.jasper.level = WARN

logger.apache.name = org.apache
logger.apache.level = WARN
